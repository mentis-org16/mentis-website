name: Website quality

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/academy-assistant-and-packages

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build and HTTP verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      EXPECTED_SITE_ORIGIN: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Check out the Mentis website
        uses: actions/checkout@v4

      - name: Set up the supported Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run offline behavior tests
        run: npm test

      - name: Build the production site
        run: npm run build

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Start the build and verify the real HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/mentis-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            cat /tmp/mentis-next-start.log
            exit 1
          fi

          npm run verify:site -- http://127.0.0.1:3000
